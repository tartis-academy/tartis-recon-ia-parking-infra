# Lo que un orquestador aporta frente a Compose: escalado por carga y
# reemplazo automatico de pods sin cortar el trafico. Requiere metrics-server
# (`minikube addons enable metrics-server -p parking`).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: stay-service
  namespace: parking
  labels:
    app.kubernetes.io/name: stay-service
    app.kubernetes.io/part-of: parking
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: stay-service
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleUp:
      # Por defecto son 0s: con un arranque de Spring de ~40s el HPA no ve
      # todavia el efecto de la replica anterior y sobreescala.
      stabilizationWindowSeconds: 30
    scaleDown:
      stabilizationWindowSeconds: 300
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: stay-service
  namespace: parking
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: stay-service

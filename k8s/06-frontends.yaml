# Los tres se sirven a traves de Kong (rutas /, /mfe/entryexit, /mfe/admin en
# kong.yml), no publican puerto propio. Module Federation resuelve los remotos
# por ruta relativa, asi que las imagenes valen sin reconstruir.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: parking
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: parking
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend
        app.kubernetes.io/part-of: parking
    spec:
      # nginx resuelve el upstream `kong` una sola vez al arrancar y aborta si
      # todavia no responde. En Compose lo evita depends_on.
      initContainers:
        - name: wait-for-kong
          image: postgres:15.18-alpine
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "until nc -z kong 8000; do sleep 2; done"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
      containers:
        - name: nginx
          image: parking/frontend:demo
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 15
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: parking
spec:
  selector:
    app.kubernetes.io/name: frontend
  ports:
    - name: http
      port: 80
      targetPort: http
---

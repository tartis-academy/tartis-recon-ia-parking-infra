$kind: http-request
description: |-
  GET /v1/tariffs/{id} -> 200.

  Nota de implementacion: `/active` se declara ANTES que `/{id}` en el controlador para que Spring no intente parsear 'active' como UUID.
url: "{{baseUrlTariff}}/v1/tariffs/{{tariffId}}"
method: GET
scripts:
  - type: afterResponse
    code: pm.test('200 OK', () => pm.response.to.have.status(200));
    language: text/javascript
order: 5000

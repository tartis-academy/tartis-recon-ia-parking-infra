$kind: http-request
description: |-
  PATCH /v1/vehicles/{id}/status -> 204 No Content.

  **Sin body.** El controlador no lee `active`: siempre desactiva (`deleteVehicleUseCase.deactivate`). Reactivar no es posible por REST hoy.

  Deja el vehiculo listo para probar **RN-11** en el check-in de stay (vehiculo desactivado -> 422).
url: "{{baseUrlVehicle}}/v1/vehicles/{{vehicleId}}/status"
method: PATCH
scripts:
  - type: afterResponse
    code: pm.test('204 No Content', () => pm.response.to.have.status(204));
    language: text/javascript
order: 7000

$kind: http-request
description: Sin Authorization -> Kong debe rechazar antes de llegar a vehicle-service.
url: "{{kongBaseUrl}}/api/v1/vehicles"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('401 Unauthorized (jwt plugin de Kong)', () => pm.response.to.have.status(401));
    language: text/javascript
order: 1000

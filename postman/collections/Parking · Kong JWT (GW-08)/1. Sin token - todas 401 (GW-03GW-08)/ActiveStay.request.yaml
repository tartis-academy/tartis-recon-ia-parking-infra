$kind: http-request
description: |-
  Sin Authorization -> Kong debe rechazar antes de llegar a stay-service.
  Ruta anadida al enrutar M-03 (decision consciente: se mantiene el nombre
  camelCase de `ActiveStayRestAdapter` tal cual, ver AUDITORIA-RELEASE.md).
url: "{{kongBaseUrl}}/api/v1/activeStay"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('401 Unauthorized (jwt plugin de Kong)', () => pm.response.to.have.status(401));
    language: text/javascript
order: 7000

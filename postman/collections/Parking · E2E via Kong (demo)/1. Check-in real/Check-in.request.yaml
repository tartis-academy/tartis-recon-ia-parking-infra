$kind: http-request
description: |-
  Una sola peticion: stay orquesta vehicle, spot y tariff por dentro. Genera una
  matricula aleatoria en cada ejecucion para que la coleccion se pueda repetir
  sin chocar con CB-05 (un vehiculo no puede entrar dos veces).

  Guarda `stayId` y **sobreescribe `spotId`** con la plaza que eligio stay, que
  no tiene por que ser la creada en el paso anterior.
url: "{{kongBaseUrl}}/api/v1/stays/check-in"
method: POST
headers:
  Content-Type: application/json
  Authorization: "Bearer {{accessToken}}"
body:
  type: json
  content: |-
    {
      "plate": "{{plate}}",
      "vehicleType": "{{vehicleType}}"
    }
scripts:
  - type: beforeRequest
    code: |-
      const digits = String(Math.floor(1000 + Math.random() * 9000));
      const abc = 'BCDFGHJKLMNPRSTVWXYZ';
      let letters = '';
      for (let i = 0; i < 3; i++) {
        letters += abc.charAt(Math.floor(Math.random() * abc.length));
      }
      pm.environment.set('plate', digits + letters);
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('201 Created — barrera abierta', () => pm.response.to.have.status(201));
      const body = pm.response.json();
      pm.environment.set('stayId', body.stayId);
      pm.environment.set('spotId', body.spotId);
      pm.test('estancia creada', () => {
        pm.expect(body.stayId).to.be.a('string');
        pm.expect(body.spotId).to.be.a('string');
        pm.expect(body.status).to.eql('IN_PROGRESS');
      });
    language: text/javascript
order: 2000

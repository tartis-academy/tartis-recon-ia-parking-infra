$kind: http-request
description: GET /v1/spots/{id} -> 200.
url: "{{baseUrlSpot}}/v1/spots/{{spotId}}"
method: GET
headers:
  Authorization: "Bearer {{accessToken}}"
scripts:
  - type: afterResponse
    code: pm.test('200 OK', () => pm.response.to.have.status(200));
    language: text/javascript
order: 4000

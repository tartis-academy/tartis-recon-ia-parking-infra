$kind: http-request
description: |-
  POST /v1/spots/occupy -> 200 con la plaza asignada.

  Body: `{"type": "CAR"}` (campo `type`, NO `vehicleType`).

  Es el endpoint que stay-service necesita en el check-in. Si no queda ninguna plaza libre de ese tipo, aqui se materializa **RN-01 (parking completo)**.

  > Ojo: `StaySpotClientAdapter.occupySpot` llama a esta ruta con **PATCH**, no con POST -> hoy recibe 405 y el check-in nunca ocupa plaza. Ver README, seccion 'Bugs conocidos'.
url: "{{baseUrlSpot}}/v1/spots/occupy"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "type": "{{vehicleType}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('200 OK', () => pm.response.to.have.status(200));
      const body = pm.response.json();
      pm.environment.set('spotId', body.id);
      pm.test('queda OCCUPIED', () => pm.expect(body.status).to.eql('OCCUPIED'));
    language: text/javascript
order: 5000

$kind: http-request
description: |-
  `GET /v1/spots/availability` esta en el openapi.yml pero no en `SpotRestAdapter`.

  Devuelve **404**... o peor: Spring puede intentar resolver `availability` como el `{id}` UUID del GET por id y responder 400. En ninguno de los dos casos es un resultado de negocio.
url: "{{baseUrlSpot}}/v1/spots/availability?type=CAR"
method: GET
queryParams:
  - key: type
    value: CAR
    description: no implementado
order: 1000

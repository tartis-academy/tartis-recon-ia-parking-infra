$kind: http-request
description: "Lo que el contrato espera de `PATCH /{id}/status`: cambiar el estado. Hoy este body **se ignora** (el controlador solo lee `type`) y la respuesta sera un 200 engañoso con el estado sin tocar."
url: "{{baseUrlSpot}}/v1/spots/{{spotId}}/status"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "status": "UNAVAILABLE"
    }
order: 2000

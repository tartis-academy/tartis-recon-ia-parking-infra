$kind: http-request
description: 'PUT /v1/spots/{id} -> 200. Body: `{"type": ...}`. Solo cambia el tipo de plaza.'
url: "{{baseUrlSpot}}/v1/spots/{{spotId}}"
method: PUT
headers:
  Content-Type: application/json
  Authorization: "Bearer {{accessToken}}"
body:
  type: json
  content: |-
    {
      "type": "MOTORBIKE"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('200 OK', () => pm.response.to.have.status(200));
      pm.test('tipo actualizado', () => pm.expect(pm.response.json().type).to.eql('MOTORBIKE'));
    language: text/javascript
order: 7000

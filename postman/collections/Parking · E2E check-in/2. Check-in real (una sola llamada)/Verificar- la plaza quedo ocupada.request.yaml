$kind: http-request
name: "Verificar: la plaza quedo ocupada"
description: |-
  La prueba de que el check-in llego de verdad hasta spot-service: la plaza que devolvio el check-in tiene que estar en `OCCUPIED`.

  Si esta `AVAILABLE`, la llamada saliente de stay no funciono.
url: "{{baseUrlSpot}}/v1/spots/{{spotId}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('200 OK', () => pm.response.to.have.status(200));
      pm.test('la plaza del check-in esta OCCUPIED', () =>
        pm.expect(pm.response.json().status).to.eql('OCCUPIED'));
    language: text/javascript
order: 3000

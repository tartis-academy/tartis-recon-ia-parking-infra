$kind: http-request
name: "Verificar: checkout de nuevo da 404"
description: "La estancia ya esta FINISHED: repetir el checkout no debe encontrar ninguna en curso."
url: "{{baseUrlStay}}/v1/stays/check-out"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "plate": "{{plate}}"
    }
scripts:
  - type: afterResponse
    code: pm.test('404 Not Found', () => pm.response.to.have.status(404));
    language: text/javascript
order: 5000

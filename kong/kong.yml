_format_version: "3.0"

services:
  - name: vehicle-service
    url: http://vehicle-service:8080/v1/vehicles
    routes:
      - name: vehicle-service-route
        paths:
          - /api/v1/vehicles
        strip_path: true
        plugins:
          - name: jwt
            config:
              claims_to_verify: ["exp"]
              uri_param_names: []

  - name: spot-service
    url: http://spot-service:8080/v1/spots
    routes:
      - name: spot-service-route
        paths:
          - /api/v1/spots
        strip_path: true
        plugins:
          - name: jwt
            config:
              claims_to_verify: ["exp"]
              uri_param_names: []

  - name: tariff-service
    url: http://tariff-service:8080/v1/tariffs
    routes:
      - name: tariff-service-route
        paths:
          - /api/v1/tariffs
        strip_path: true
        plugins:
          - name: jwt
            config:
              claims_to_verify: ["exp"]
              uri_param_names: []

  - name: ticket-service-entry-tickets
    url: http://ticket-service:8080/v1/entry-tickets
    routes:
      - name: ticket-service-entry-tickets-route
        paths:
          - /api/v1/entry-tickets
        strip_path: true
        plugins:
          - name: jwt
            config:
              claims_to_verify: ["exp"]
              uri_param_names: []

  - name: ticket-service-tickets
    url: http://ticket-service:8080/v1/tickets
    routes:
      - name: ticket-service-tickets-route
        paths:
          - /api/v1/tickets
        strip_path: true
        plugins:
          - name: jwt
            config:
              claims_to_verify: ["exp"]
              uri_param_names: []

  # stay-service expondra ademas un endpoint SSE (SSE-08, pendiente). No tocar
  # esta ruta para incluirlo: hay que crear una ruta nueva, porque necesita dos
  # cosas distintas de las demas.
  #
  #   1. jwt leyendo el token de la query string, no de la cabecera: la API
  #      EventSource del navegador no permite cabeceras propias. Es decir
  #      uri_param_names: ["access_token"] (NO "jwt", el default de Kong: el
  #      front manda ?token=, Kong por defecto esperaria ?jwt= y Spring lee
  #      ?access_token=; los tres se alinean en access_token -RFC 6750-,
  #      el unico nombre con el que el resolver de Spring detecta token
  #      smuggling de fabrica) y header_names: [], la unica excepcion al
  #      resto del fichero.
  #   2. file-log a nivel de route con custom_fields_by_lua, porque el
  #      serializer de Kong NO redacta la query string y el token acabaria en
  #      los logs (ver la nota del plugin file-log mas abajo).
  #
  # scripts/ci/validate_kong.py exige las dos cosas para el nombre de ruta
  # stay-service-events-route, asi que el CI bloquea si SSE-08 entra sin ellas.
  - name: stay-service
    url: http://stay-service:8080/v1/stays
    routes:
      - name: stay-service-route
        paths:
          - /api/v1/stays
        strip_path: true
        plugins:
          - name: jwt
            config:
              claims_to_verify: ["exp"]
              uri_param_names: []

  # ActiveStayRestAdapter expone /v1/activeStay en stay-service, la unica ruta
  # en camelCase del proyecto (el resto usa kebab-case: entry-tickets,
  # check-in). Decision consciente al enrutarla: mantener el nombre tal cual
  # en vez de renombrar el endpoint en stay-service (cambio de codigo en otro
  # repo, fuera de alcance de este PR). La inconsistencia de nomenclatura
  # queda documentada, no oculta. Ver AUDITORIA-RELEASE.md M-03.
  - name: stay-service-active-stay
    url: http://stay-service:8080/v1/activeStay
    routes:
      - name: stay-service-active-stay-route
        paths:
          - /api/v1/activeStay
        strip_path: true
        plugins:
          - name: jwt
            config:
              claims_to_verify: ["exp"]
              uri_param_names: []

  # Estaticos del frontend (shell + microfrontends), sin plugin jwt: sirven
  # HTML/JS/CSS, no datos.
  - name: mfe-entryexit
    url: http://mfe-entryexit:80
    routes:
      - name: mfe-entryexit-route
        paths:
          - /mfe/entryexit
        strip_path: true

  # Catch-all: su path "/" es prefijo de todo lo demas, pero Kong empareja
  # por el prefijo mas especifico independientemente del orden en el fichero,
  # asi que las rutas /api/v1/* y /mfe/entryexit de arriba siguen ganando.
  # Efecto secundario a tener en cuenta al depurar: una URL de API mal escrita
  # (ej. /api/v1/vehicless, sin ruta que la matchee) no cae en un 404 de Kong,
  # cae aqui y devuelve el HTML del shell — comportamiento esperado de un SPA
  # detras de un reverse proxy, pero confunde si no se sabe.
  - name: shell
    url: http://frontend:80
    routes:
      - name: shell-route
        paths:
          - /
        strip_path: false

consumers:
  - username: keycloak-parking
    jwt_secrets:
      - key: "http://localhost:8180/realms/parking"
        algorithm: RS256
        rsa_public_key: |
          -----BEGIN PUBLIC KEY-----
          MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAwDA4CetbA5/GrAA7BqlF
          YuJOcQANcm9H16KzCVYsOfPLCf5t0eh9k8PBFpW7mF5B8uBYiNbMvQKCimk8Ezln
          oj6503Gn63A/hPfuiUEgzJyykLBQ8WZmuxhR7t5Sggx1XAHcU60XP8XJffs2fFGj
          fdE7DxaEfxsTWXmR/aY7T28YsrR7YQ0UxAinKeypB4bqiiusHcTwYO+2g/58CPBQ
          aSLueZbxCwEt7ArBEIzhGa1nRU3m4T3TDxLWOnS9KuBcRTByqEgQ5a344r7VmA6w
          gBGevDfQRHR4hHwSX/sDNjn0tZnMKPHKWsBgn3zwKQD8wbMb2LlTBH9ru+EPl6S5
          KwIDAQAB
          -----END PUBLIC KEY-----

plugins:
  - name: cors
    config:
      origins:
        - "http://localhost:8090"
        - "http://localhost:5173"
        - "http://localhost:5000"
        # mfe-entryexit ya no publica puerto de host en el stack de demo (va
        # detras de Kong en /mfe/entryexit, mismo origen que el shell), pero
        # `vite dev` local en :5001 (fuera de Docker, sin Kong delante de sus
        # estaticos) sigue llamando a la API de Kong directo desde ese origen,
        # asi que se queda.
        - "http://localhost:5001"
        # mfe-admin todavia no esta contenerizado (fuera de este PR) y llama a
        # Kong directo desde su puerto de dev; revisar cuando se contenerice
        # (mismo cambio que mfe-entryexit: pasar a servirse via Kong).
        - "http://localhost:5002"
      methods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
      headers: [Accept, Content-Type, Authorization]
      # GW-06: sin Access-Control-Expose-Headers, el navegador recibe la
      # cabecera X-Correlation-ID pero el JavaScript del front NO puede
      # leerla. Solo se exponen las cabeceras simples de CORS salvo que se
      # listen aqui explicitamente. Sin esto, echo_downstream del plugin
      # correlation-id no sirve de nada para el frontend.
      exposed_headers: ["X-Correlation-ID"]
      credentials: true
      max_age: 3600

  # ============================================================
  # GW-06 — trazabilidad
  # ============================================================
  #
  # Reparto de responsabilidades, porque Kong solo puede dar la mitad:
  #
  #   Kong   -> identidad de PETICION (X-Correlation-ID), propagada upstream
  #   Spring -> identidad de USUARIO (sub del JWT), en el MDC de cada micro
  #
  # Kong no puede identificar al usuario: el plugin jwt casa el token contra
  # el consumer cuya `key` es el claim iss, y los tres usuarios del realm
  # (admin.test, operario.test, user.test) salen del mismo issuer, asi que
  # todos mapean al consumer keycloak-parking. Las cabeceras X-Consumer-*
  # que Kong inyecta upstream valen igual para un ADMIN que para un USER.
  # Ver docs/adr/0001.
  #
  # Los logs de Kong y los de los 5 microservicios se unen por el
  # correlation-id; el usuario sale del log del micro.
  - name: correlation-id
    config:
      header_name: X-Correlation-ID
      # Por defecto seria Kong-Request-ID. Se renombra porque es el nombre que
      # esperan los filtros de los microservicios (CorrelationIdFilter).
      generator: uuid#counter
      # Por defecto es false: hay que activarlo para devolver la cabecera al
      # cliente. Asi el front puede mostrarla en un error y el usuario pegarla
      # en un ticket de soporte.
      echo_downstream: true

  # Registro estructurado (JSON) de cada peticion a stdout, que es donde Kong
  # ya escribe (KONG_PROXY_ACCESS_LOG=/dev/stdout), asi que lo recoge
  # `docker logs parking-kong` sin montar volumenes.
  #
  # No filtra el token: el serializer de Kong redacta de oficio las cabeceras
  # Authorization y Proxy-Authorization (kong/pdk/log.lua). Comprobable con:
  #   docker logs parking-kong --tail 1 | grep -o '"authorization":"[^"]*"'
  #   -> "authorization":"REDACTED"
  #
  # Lo que NO redacta es la query string, y la mete en tres campos
  # (request.uri, request.url, request.querystring). Irrelevante en estas 7
  # rutas, donde el token va en cabecera. CRITICO en la ruta SSE (SSE-08),
  # donde EventSource obliga a mandarlo en la URL: alli hay que declarar
  # file-log a nivel de route con custom_fields_by_lua para taparlos. El
  # validador de scripts/ci lo exige, asi que la ruta SSE no puede entrar sin
  # esa redaccion.
  - name: file-log
    config:
      path: /dev/stdout
